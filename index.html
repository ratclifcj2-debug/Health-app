:root{color-scheme:dark;--bg:#080d0a;--card:#151d18;--line:#29362e;--muted:#9aa99e;--green:#52ed92;--text:#f2f8f4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}main{max-width:750px;margin:auto;padding:18px 15px 110px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:17px}.brand{font-size:25px;font-weight:850;letter-spacing:-1px}.brand span,.accent{color:var(--green)}.sub{color:var(--muted);font-size:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;margin-bottom:13px}.card h2{font-size:18px;margin:0 0 10px}.card h3{font-size:15px;margin:0 0 8px}h1{font-size:26px;line-height:1.2;margin:0 0 5px}p{margin:7px 0 12px}.muted{color:var(--muted)}.pill{border:1px solid #35674b;border-radius:99px;padding:5px 10px;background:#142a1c;color:var(--green);font-size:12px;font-weight:750}.progress{height:9px;border-radius:9px;background:#2b3930;overflow:hidden}.progress>div{height:100%;background:var(--green);transition:width .2s}.between{display:flex;justify-content:space-between;align-items:center;gap:10px}.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:13px}.stat{background:#0e1510;border-radius:12px;text-align:center;padding:10px 5px}.stat strong{display:block;font-size:19px;color:var(--green)}.stat small{color:var(--muted)}.sectionlabel{font-size:11px;color:var(--green);text-transform:uppercase;letter-spacing:1.3px;font-weight:800;margin:12px 0 6px}.exercise{border-top:1px solid var(--line);padding:11px 0;display:flex;gap:12px;align-items:center}.exercise:first-of-type{border-top:0}.exbody{flex:1;min-width:0}.exbody strong{display:block;font-size:14px}.exbody small{color:var(--muted)}.check{width:23px;height:23px;accent-color:var(--green);flex:none}.action{border:1px solid #426b4e;background:#183523;color:var(--green);padding:9px 12px;border-radius:10px;font-weight:750}.action.primary{background:var(--green);color:#06210f;border-color:var(--green)}.action.ghost{border-color:var(--line);background:transparent;color:var(--text)}.nav{position:fixed;bottom:0;left:0;right:0;background:#101711f5;border-top:1px solid var(--line);display:flex;justify-content:center;padding:7px 4px max(8px,env(safe-area-inset-bottom));z-index:10}.nav button{width:25%;max-width:170px;background:none;color:var(--muted);border:0;padding:8px 2px;font-size:12px}.nav button.active{color:var(--green);font-weight:800}.nav b{display:block;font-size:21px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.habit{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:10px 0}.habit label{flex:1}.habit small{display:block;color:var(--muted)}.input{background:#0b120e;color:var(--text);border:1px solid #3b5141;border-radius:9px;padding:10px;width:100%;min-width:0}.tiny{width:85px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{padding:10px 1px;border:1px solid var(--line);border-radius:11px;text-align:center;background:#0e1510;color:var(--text)}.day.selected{border-color:var(--green);background:#193522}.day small{display:block;color:var(--muted);font-size:10px}.day strong{font-size:14px}.detail{padding:12px 0;border-top:1px solid var(--line)}.detail summary{cursor:pointer;font-weight:700}.detail p{font-size:13px;color:#cad5cc}.sets{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 35px;gap:7px;align-items:center;margin:8px 0}.sets .input{padding:8px 5px;text-align:center}.note{background:#142b1c;border-left:3px solid var(--green);padding:11px;border-radius:8px;font-size:13px;color:#cde8d5}.plan-day{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);padding:13px 2px;background:transparent;color:var(--text)}.plan-day.selected{background:#163421;border-radius:8px;padding-left:8px;padding-right:8px}.plan-day small{display:block;color:var(--muted);margin-top:3px}.plan-day .accent{white-space:nowrap;font-size:12px}.habit label{cursor:pointer}.hide{display:none}.award{padding:11px;border:1px solid var(--line);border-radius:12px;margin:7px 0}.award.unlocked{border-color:#448a5a;background:#17321f}.large{font-size:25px;font-weight:800}.foot{font-size:12px;color:var(--muted)}@media(min-width:700px){.card{padding:22px}.gridDesktop{display:grid;grid-template-columns:1fr 1fr;gap:13px}.gridDesktop .card{margin-bottom:0}}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:18px}.cal-head{text-align:center;color:var(--muted);font-size:12px;padding:7px 0}.cal-cell{aspect-ratio:1 / 1;min-height:0;min-width:0;border:1px solid var(--line);border-radius:10px;background:#111a14;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;padding:8px 2px}.cal-cell span{font-size:10px;color:var(--green);line-height:1.3;text-align:center}.cal-cell.selected{border-color:var(--green);background:#193724}.cal-cell em{color:var(--green);font-style:normal}.cal-empty{min-height:72px} .nav{grid-template-columns:repeat(5,minmax(0,1fr))!important} @media(max-width:420px){.cal-cell{min-height:0}.cal-cell span{font-size:9px}}
 .guide-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin:12px 0}.guide-card{padding:23px 18px;min-height:300px}.guide-card h1{margin:12px 0}.guide-meta{font-size:12px;color:var(--green);font-weight:800;text-transform:uppercase;letter-spacing:.6px}.guide-controls{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:22px;flex-wrap:wrap}.guide-controls .action:disabled{opacity:.3;cursor:default} .nav button{font-size:11px} 
.exercise-photo{display:block;width:100%;max-height:330px;object-fit:contain;border-radius:12px;margin:12px 0;background:#0c1310}.ex-guidance{white-space:normal;line-height:1.65}.ex-guidance p{margin:8px 0}.ex-guidance .steps{padding-left:20px}.timed-log{margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:12px}.timed-log .action{margin:3px}.timed-log .timer-readout{font-variant-numeric:tabular-nums;font-size:22px;font-weight:800;color:var(--green)}.log-heading{font-size:12px;color:var(--muted);margin:14px 0 7px}.sets{margin-top:8px}.log-complete{color:var(--green);font-weight:700}.ex-note{font-size:12px;color:var(--muted);margin-top:8px}
</style><style>.cal-cell{aspect-ratio:1/1;position:relative;justify-content:center;padding:4px 1px;gap:3px}.cal-cell.done{background:#d9a72c;border-color:#ffe08a;color:#241a00;box-shadow:inset 0 0 0 1px #ffe08a}.cal-cell.done strong{color:#241a00}.cal-cell.done span{color:#4a3500}.cal-cell span{font-size:9px}.cal-empty{aspect-ratio:1/1}@media(max-width:380px){.cal-grid{gap:3px}.cal-cell strong{font-size:13px}.cal-cell span{font-size:8px}}</style><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="application-name" content="Chris's App"></head><body><main id="app"></main><nav class="nav" id="nav"></nav><script>
const DATA={"flow":[{"name":"Sled Warm Up","dose":"1 × 10 m","targets":"Arch of foot, calves, quads, glutes","how":"Start with backward sled work; later gradually add push/pull up to twice weekly. No sled: backward walking or carefully walking backward on an unpowered treadmill.","standard":"Bodyweight backwards walk"},{"name":"Tibialis Raise","dose":"2 × 25","targets":"Tibialis anterior","how":"Hips against wall, heels about 12 inches out. Lift toes toward shins.","standard":"None"},{"name":"Deep Calf Raise","dose":"2 × 25","targets":"Soleus","how":"Sit on a sturdy bench with knees bent and feet planted. Position a dumbbell securely over each thigh, just above the knee. Keeping your knees bent, raise your heels onto the balls of your feet, pause, and lower under control. Begin with light weight; do not let the dumbbells roll. Perform 2 sets of 25 repetitions.","standard":"Seated, bent-knee weighted calf raise; weight per dumbbell."},{"name":"Reverse Step Up","dose":"2 × 25 / side","targets":"Quadriceps / VMO","how":"Stand upright on level ground, extend one leg straight approximately 6 inches in front. Bend your standing knee, allowing your hips to travel forward, until the extended heel lightly taps the ground. Pause for one second and straighten the standing leg. For an elevated variation, stand on a stable step/platform, extend the free leg straight forward, and lower under control; optional dumbbells can add resistance. Complete 2 sets of 25 on each leg.","standard":"Floor or elevated platform; optional dumbbells. Record height and added weight."},{"name":"Full Range Split Squats","dose":"2 × 10 / side","targets":"Psoas, quads, glutes, soleus","how":"Place your front foot on a stable elevated platform, feet approximately hip-width apart, and step the other foot backward. Keep your torso upright. Bend the front knee forward over the toes while lowering your hips; keep the rear leg as straight as comfortably possible. Lower only within a controlled, comfortable range and press through the front foot to return. Use rack support if needed. Complete 2 sets of 10 per leg.","standard":"Supported elevated, unsupported elevated, or floor-level; optional dumbbells."},{"name":"External Rotation","dose":"1 × 15 / side","targets":"Teres minor, infraspinatus","how":"Sit on the floor with one leg straight and the other knee bent with foot planted. Rest the working elbow on the bent knee, keeping your upper arm supported. With a very light dumbbell and elbow bent around 90 degrees, rotate the forearm downward through a comfortable arc of up to about 90 degrees; rotate back slowly without lifting the elbow. Complete 15 per arm.","standard":"Seated on floor, one leg straight and one bent; elbow supported on bent knee."},{"name":"Pullover","dose":"2 × 15","targets":"Thoracic spine, shoulders, upper back","how":"Position a flat bench crosswise under your upper back around your shoulder blades. Plant both feet firmly, brace your trunk, and hold one dumbbell securely in both hands over the chest. With a slight consistent elbow bend, lower the dumbbell behind your head as far as the shoulders comfortably allow, then return over the chest without arching the lower back. Perform 2 sets of 15.","standard":"Bench across shoulder blades; one dumbbell held with both hands."},{"name":"Trap 3 Raise","dose":"2 × 10","targets":"Lower trapezius","how":"Stand with knees slightly bent and hinge at the hips, or support the chest on an incline bench. With thumbs pointing back/up, raise both arms FORWARD and diagonally into a Y shape rather than directly out to the sides. Keep shoulders away from ears and torso still. Lower slowly. Begin unweighted, then use very light dumbbells. Perform 2 sets of 10.","standard":"Forward Y raise, not lateral raise; standing or incline bench."},{"name":"Back Extensions","dose":"Level-specific","targets":"Spinal erectors, intraspinal muscles","how":"Use a 45-degree back-extension bench with the pad positioned to allow a comfortable hip hinge. Start at Level 1 with a supported static hold and gradually build tolerance. Progress through the six levels only when comfortable; level changes are manual. Record one deposit for a completed session/dose. No next-day check-in is required in the app.","standard":"Six manually selected progression levels; one deposit per date/level/dose."},{"name":"Hip Flexor Kick Out","dose":"2 × 5 / side · 5s hold","targets":"Hip flexors / psoas","how":"Stand upright beside a wall or rack for balance. Keeping the working leg STRAIGHT, lift it directly forward in a slow, controlled kick. Hold the leg out for 5 seconds, then lower under control. Avoid leaning back or rounding your spine. Complete 2 sets of 5 kicks on each leg, with a 5-second hold per kick.","standard":"Straight-leg forward kick, not knee raise then extension."},{"name":"Side Bend","dose":"2 × 12 / side","targets":"Quadratus lumborum","how":"Position yourself sideways on a 45-degree back-extension bench, with your feet securely supported and hips against the pad. Begin with your body aligned and lower your torso sideways toward the floor in a controlled range. Raise your torso back into a straight line without twisting or hyperextending. Begin with bodyweight, then optionally hold a light dumbbell. Perform 2 sets of 12 per side.","standard":"45-degree back-extension bench, sideways setup; optional dumbbell."}],"mob":[{"name":"Couch Stretch","dose":"2 × 1 min / side","targets":"Rectus femoris, hip flexors","how":"Kneel on a padded surface facing away from a wall or couch. Place the rear knee near the wall with the shin up the wall, and put the opposite foot forward. Gently engage the rear glute and bring your torso upright without excessively arching your back. Hold 60 seconds per side, twice. Move the rear knee farther from the wall if needed.","standard":"Two 60-second holds per side."},{"name":"Fire Hydrants","dose":"1 × 10 CW + 10 CCW / side","targets":"Glute medius/minimus, TFL","how":"Start on hands and knees with hands beneath shoulders and knees beneath hips. Keep your trunk stable and your working knee bent roughly 90 degrees. Lift that knee outward and draw 10 controlled circles clockwise, then 10 counterclockwise. Repeat on the other leg. Do not rotate your torso or force through painful clicking.","standard":"Log clockwise and counterclockwise separately for both legs."},{"name":"Clamshells","dose":"1 × 10 / side","targets":"Gluteus medius, deep hip external rotators","how":"Lie on your side with hips and knees bent about 45 degrees and feet stacked together. Keeping the feet touching and pelvis steady, lift your top knee without rolling backward. Pause, lower slowly, and perform 10 reps per side. Add a light loop band above the knees only after you can control the movement.","standard":"Immediately after Fire Hydrants; bodyweight or resistance band."},{"name":"90/90 Rotation","dose":"1 × 10 / side","targets":"Outer hip rotators","how":"Sit on the floor in a 90/90 hip position with both knees bent roughly 90 degrees and hands supported behind you. Keep the front leg and torso relatively still. Lift the HEEL of the rear leg and rotate its foot inward toward the front heel, keeping the rear knee comparatively stationary. Return under control. Do 10 repetitions each side; work toward less hand support.","standard":"Rear-foot internal rotation, not torso rotation."},{"name":"Outer Hip Dropset","dose":"1 full dropset / side","targets":"Glute med/min, piriformis, TFL","how":"Complete three stages back-to-back on each side: 30 seconds of controlled hip internal rotation, 30 seconds of actively lifting the knee and foot, then 30 seconds of controlled kickouts. Do not rest between stages. Repeat the 90-second sequence on the other side. Use a comfortable range; the precise setup should follow your original exercise demonstration.","standard":"90-second timer per side, three automatic 30-second stages."},{"name":"Pigeon Strength","dose":"1 × 20 / side","targets":"Piriformis, outer glutes","how":"Face an inclined bench and place the front leg across it with the knee bent approximately 45 degrees. Extend the rear leg straight back. Use hands lightly for support, actively press the front knee/lower leg into the bench to raise the torso and hips slightly, then lower under control. Complete 20 repetitions per side. A higher incline is easier; aim to reduce hand support.","standard":"Incline-bench ACTIVE pigeon strengthening, not floor pigeon stretch."},{"name":"Deep Squats","dose":"2 × 2 min","targets":"Quads, glutes, hamstrings, ankles","how":"Stand about shoulder-width with toes slightly outward. Lower into a comfortable deep squat while keeping knees tracking over toes and heels grounded as able. Use rack support or a heel lift if needed. Move slowly through controlled squats for 2 minutes, rest, and repeat; if your original program calls for a sustained hold instead, use that variation.","standard":"Two 2-minute timed sets; hold vs repetitions remains to be confirmed."},{"name":"Loaded Butterfly","dose":"2 × 1 min","targets":"Inner thigh, groin, hips","how":"Sit upright with soles of the feet together and knees bent outward. Place ONE LIGHT DUMBBELL on each thigh just above the knee, stabilizing each with a hand; do not put weights between the feet. Allow gentle downward resistance, then actively lift the knees upward against the weights and lower with control. Repeat for 60 seconds, twice. Elevate the seat if the lower back rounds.","standard":"Two dumbbells, one on each thigh just above the knee; record weight PER dumbbell."},{"name":"Active Hangs","dose":"1 × 1 min","targets":"Shoulders, grip, core","how":"Grasp a secure pull-up bar with both hands at about shoulder width. Hang with arms straight, core gently braced and legs still, allowing comfortable shoulder lengthening without forcing the joints. Use light foot support or multiple shorter hangs if necessary. Accumulate 60 seconds. This is a grip/shoulder mobility drill, not a pull-up.","standard":"60-second timed hold; foot-assisted or full bodyweight."}],"strength":{"1":[{"name":"Barbell Bench Press","dose":"3 × 6–8","targets":"Chest, triceps, front delts","how":"Set safety bars or use a spotter. Plant feet, maintain a stable upper back, lower bar under control toward mid-chest, and press without bouncing. Start with 2 working sets for the first 2 weeks.","standard":"Leave ~2–3 reps in reserve; increase load only after all sets reach 8 clean reps."},{"name":"Single-arm Dumbbell Row","dose":"3 × 8–12 / side","unilateral":true,"targets":"Lats, upper back; left/right balance","how":"Support one hand and knee on bench, brace torso, pull elbow toward hip without twisting. Begin with the weaker side and match reps on the stronger side.","standard":"Log both sides separately; avoid compensatory torso rotation."},{"name":"Pull-ups / Band-assisted Pull-ups","dose":"3 × 5–10","targets":"Lats, upper back, biceps","how":"Use a secure bar and assistance band as needed. Begin from an active shoulder position, pull with controlled range, lower smoothly. Record assistance in notes if used.","standard":"Choose assistance that allows clean repetitions; do not force painful shoulder positions."},{"name":"Dumbbell Lateral Raise","dose":"2 × 12–20","targets":"Side deltoids; shoulder width","how":"Use light dumbbells, soft elbows, raise arms roughly to shoulder height in a comfortable plane. Avoid swinging or shrugging.","standard":"Controlled repetitions, no momentum."},{"name":"Band Pallof Press","dose":"2 × 10–12 / side","unilateral":true,"targets":"Anti-rotation core control","how":"Anchor band securely at chest height. Stand side-on, press hands straight forward while resisting rotation. Repeat facing the other direction.","standard":"Equal controlled reps on each side."}],"3":[{"name":"Incline Dumbbell Press","dose":"3 × 8–12","targets":"Upper chest, front delts, triceps","how":"Set bench to a moderate incline (~15–30°). Lower dumbbells with control, keep wrists stacked, and press without bouncing.","standard":"Use an incline and range comfortable for shoulders."},{"name":"Chest-supported Dumbbell Row","dose":"3 × 8–12","targets":"Mid-back, lats, rear delts","how":"Lie chest-down on an inclined bench. Row dumbbells toward ribs while keeping chest supported; pause briefly and lower slowly.","standard":"Avoid using lower-back momentum."},{"name":"Pull-ups / Band-assisted Pull-ups","dose":"2 × 5–10","targets":"Lats, biceps","how":"Use a secure bar and band assistance as needed; controlled upward and downward phases.","standard":"Quality and full comfortable range before adding reps."},{"name":"Single-arm Dumbbell Lateral Raise","dose":"2 × 12–15 / side","unilateral":true,"targets":"Side deltoids; left/right balance","how":"Stand tall with light dumbbell, lift arm in a comfortable arc to about shoulder height, lower slowly. Start weaker side, match stronger.","standard":"Record left and right independently."},{"name":"Hammer Curl","dose":"2 × 10–15","targets":"Biceps, brachialis, forearms","how":"Neutral grip with palms facing in. Keep upper arms near sides and lower under control without swinging.","standard":"Use controlled full comfortable range."},{"name":"Band Triceps Pressdown","dose":"2 × 10–15","targets":"Triceps","how":"Anchor band securely overhead, keep elbows close to sides, extend forearms without swinging shoulders.","standard":"Increase band tension only when reps are controlled."}],"6":[{"name":"Barbell Romanian Deadlift","dose":"3 × 6–10","targets":"Hamstrings, glutes, posterior chain","how":"Stand with bar near thighs, soften knees, push hips backward keeping bar close, stop before losing neutral trunk position, then drive hips forward. Start light and reduce range if glute/back symptoms increase.","standard":"Do not chase depth or load at expense of control."},{"name":"Supported Split Squat / Low Step-up","dose":"2 × 8–10 / side","unilateral":true,"targets":"Quads, glutes, single-leg stability","how":"Use rack upright for support. Choose a low step or shortened split squat with a comfortable knee range. Start on the less capable side and match the other side.","standard":"Pain-tolerated range; reduce or skip if knee/glute symptoms worsen."},{"name":"Banded Hamstring Curl","dose":"2 × 10–15","targets":"Hamstrings (knee flexion)","how":"Anchor band securely, curl heel toward glutes with hips stable, return slowly. Use standing or lying position according to your setup.","standard":"Smooth controlled repetitions."},{"name":"Side-lying Hip Abduction","dose":"2 × 12–15 / side","unilateral":true,"targets":"Glute medius/minimus, hip control","how":"Lie on side with top leg straight and slightly behind torso, lift without rolling pelvis backward; lower slowly.","standard":"Match clean reps side to side; avoid painful range."},{"name":"Dead Bug","dose":"2 × 10 / side","unilateral":true,"targets":"Trunk stability, anti-extension","how":"Lie on back with knees and arms up, brace gently, extend opposite arm and leg slowly while keeping lower back stable; alternate sides.","standard":"Only extend as far as you can control."}]},"backLevels":[{"name":"Iso Holds","target":"2 min double-leg hold","unit":"seconds","goal":120},{"name":"Single Leg Iso Holds","target":"1 min each side","unit":"seconds per side","goal":60},{"name":"Assisted Hinge Reps","target":"10–15 smooth half-range reps","unit":"reps","goal":15},{"name":"Full Range Reps","target":"30 controlled reps","unit":"reps","goal":30},{"name":"Single Leg Reps","target":"20 per side","unit":"reps per side","goal":20},{"name":"Weighted Reps","target":"12 loaded double-leg reps","unit":"reps","goal":12}]};
const KEY='chris-app-preview-v2';
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const addDays=(iso,n)=>{let d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const weekDay=(iso)=>new Date(iso+'T12:00:00').getDay();
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state;try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}state??={start:'2026-11-23',dates:{},level:1,habits:{},waterGoal:90,vitamins:'Vitamins / supplements (as appropriate)',view:'home',selected:today(),backDeposits:[],customExercises:[]};state.dates??={};state.habits??={};state.backDeposits??=[];state.customExercises??=[];state.selected??=today();state.view??='home';
if(!state.strengthProgramV2){for(const d of Object.values(state.dates||{})){for(const k of Object.keys(d.checks||{}))if(k.startsWith('strength:'))delete d.checks[k];for(const k of Object.keys(d.sets||{}))if(k.startsWith('strength:'))delete d.sets[k]}state.strengthProgramV2=true;}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('Storage unavailable: export backups regularly.')}};
const day=()=>state.dates[state.selected]??(state.dates[state.selected]={checks:{},sets:{},values:{}});
const wd=()=>weekDay(state.selected), flowDay=()=>[1,3,5].includes(wd()),mobDay=()=>[2,4].includes(wd());
const strengthIndex=dow=>({2:1,4:3,6:6})[dow];
const calendarWeek=(iso=state.selected)=>Math.max(1,Math.floor((new Date(iso+'T12:00:00')-new Date(state.start+'T12:00:00'))/604800000)+1);
const wk=(iso=state.selected)=>Math.max(1,calendarWeek(iso)-Math.max(0,Number(state.runWeekAdjustment)||0));
const phase=(w=wk())=>w<=12?'Return to 5K':w<=24?'5K speed + 10K endurance':'Maintenance';
const runPlan=(w,d)=>{
 const slot={1:0,3:1,5:2}[d];if(slot===undefined)return null;
 const bike=[15,22,32][slot];
 const bikeOnly=(mins)=>({name:'Easy bike trainer',dose:mins+' min',desc:'Easy conversational cycling. If symptoms increase, shorten or skip the session. Monday is optional on early-start days.'});
 if(w<=2)return bikeOnly(bike+(w-1)*3);
 if(w<=4&&slot!==1)return bikeOnly(bike);
 if(w<=6&&slot===0)return bikeOnly(bike);
 let dose='',desc='Run at a relaxed conversational effort. Walk breaks are encouraged; do not advance through worsening symptoms.';
 if(w<=4){dose=w===3?'6 × (1 min jog + 2 min walk)':'6 × (2 min jog + 2 min walk)';}
 else if(w<=6){dose=w===5?'6 × (3 min jog + 2 min walk)':'5 × (4 min jog + 2 min walk)';}
 else if(w<=8){let minutes=w===7?[18,20,24][slot]:[20,24,28][slot];dose=minutes+' min easy run/walk';desc+=' Aim for longer jogging segments with brief walk breaks as needed.';}
 else if(w<=10){dose=(w===9?[22,26,32][slot]:[25,28,35][slot])+' min easy run';}
 else if(w<=12){dose=slot===2?(w===11?'4.5 km comfortable run':'5 km continuous easy run'):(w===11?[25,30][slot]:[28,30][slot])+' min easy run';}
 else if(w<=16){dose=slot===0?'25–30 min easy run':slot===1?'25–30 min easy run + 4 × 15 sec relaxed strides':(5+(w-13)*0.5).toFixed(1)+' km easy long run';desc+=' Strides are short controlled accelerations with full walking recovery, not sprints.';}
 else if(w<=20){dose=slot===0?'30 min easy run':slot===1?(w%2?'3 × 4 min comfortably brisk, 3 min easy between':'4 × 3 min comfortably brisk, 3 min easy between'):(7+(w-17)*0.5).toFixed(1)+' km easy long run';}
 else if(w<=24){dose=slot===0?'30–35 min easy run':slot===1?(w===24?'Optional relaxed 5K benchmark':'4 × 4 min controlled tempo, 3 min easy between'):(w===24?'10 km comfortable goal run':(9+(w-21)*0.25).toFixed(1)+' km easy long run');}
 else {dose=slot===0?'30 min easy':slot===1?'30 min easy or controlled quality session':'5–10 km comfortable long run';desc+=' Maintenance: adjust weekly load to recovery.';}
 return {name:w<=12?'Return-to-running session':slot===1?'Running · quality / easy':'Running · easy endurance',dose,desc:'Warm up with 5 minutes brisk walking; '+desc+' Finish with an easy walk. Week '+w+' · '+phase(w)+'.'};
};

function setEntry(id,j,k,v){day().sets[id]??=[];day().sets[id][j]??={};day().sets[id][j][k]=v;save()}
function recordBack(){let n=Number(document.getElementById('backActual')?.value),dose=String(day().values.backDose|| (state.level===1?30:DATA.backLevels[state.level-1].goal));if(!(n>0)){alert('Enter your completed time or repetitions first.');return}if(state.backDeposits.some(x=>x.date===state.selected&&x.level===state.level&&(x.dose==null||String(x.dose)===dose))){alert('Already deposited for this date, level and dose.');return}day().values.backActual=n;state.backDeposits.push({date:state.selected,level:state.level,dose,result:n});save();render()}
function undoBack(){let dose=String(day().values.backDose|| (state.level===1?30:DATA.backLevels[state.level-1].goal));let idx=state.backDeposits.findIndex(x=>x.date===state.selected&&x.level===state.level&&(x.dose==null||String(x.dose)===dose));if(idx>=0){state.backDeposits.splice(idx,1);save();render()}}
function workout(){let ps=planned();return `${header()}<h1>Today's workout</h1><p class="muted">${safe(state.selected)} · Week ${wk()} · Check off each exercise as you finish.</p>${roadmap()}${weekstrip()}${ps.map(p=>`${title(p.name)}<div class="between" style="margin-bottom:10px"><span class="muted">${doneCount(p.id)} / ${p.count} complete</span><span class="accent">+${p.xp} XP</span></div>${itemList(p.id).map((e,i)=>exerciseBlock(e,p.id,i)).join('')}`).join('')}`}
function habitsPage(){let h=habitProgress().done;return `${header()}<h1>Daily habits</h1><p class="muted">Small actions, repeated consistently. Tap a checkbox or its label to mark it done.</p><div class="card"><h2>Water goal</h2><div class="between"><strong class="large">${safe(day().values.water||0)} <span class="muted">/ ${state.waterGoal} oz</span></strong><span class="pill">+20 XP</span></div><div class="progress"><div style="width:${Math.min(100,100*(Number(day().values.water)||0)/state.waterGoal)}%"></div></div><div class="row" style="margin-top:13px"><button class="action" onclick="waterAdd(8)">+8 oz</button><button class="action" onclick="waterAdd(16)">+16 oz</button><button class="action ghost" onclick="waterAdd(-8)">−8 oz</button></div></div><div class="card"><div class="between"><h2>Habit checklist</h2><span class="pill">${h}/${habitProgress().total}</span></div>${guideSteps().filter(s=>s.kind==='habit').map(s=>{let h=habits.find(x=>'habit:'+x[0]===s.key);return checkrow(s.key,h[1],h[2])}).join('')}<p class="foot">Habit goals include checklist items, your water goal. Workday walks and desk mobility are counted only Monday–Friday.</p></div>`}
function plan(){let selected=new Date(state.selected+'T12:00:00'),year=selected.getFullYear(),month=selected.getMonth(),first=new Date(year,month,1),offset=(first.getDay()+6)%7,days=new Date(year,month+1,0).getDate(),cells='';for(let i=0;i<Math.ceil((offset+days)/7)*7;i++){let n=i-offset+1;if(n<1||n>days){cells+='<div class="cal-empty"></div>';continue}let iso=year+'-'+String(month+1).padStart(2,'0')+'-'+String(n).padStart(2,'0'),sessions=planned(iso),d=state.dates[iso],finished=dayCompleted(iso);cells+=`<button aria-label="${iso}${finished?' completed':''}" class="cal-cell ${iso===state.selected?'selected':''} ${finished?'done':''}" onclick="openDay('${iso}')"><strong>${n}</strong><span>${sessions.map(p=>p.id==='flow'?'F':p.id==='mob'?'M':p.id==='strength'?'S':p.id==='cardio'?(cardio(iso)?.name.includes('bike')?'B':'🏃'):'R').join(' · ')}</span></button>`}let prev=new Date(year,month-1,1),next=new Date(year,month+1,1),fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01';return `${header()}<h1>Training calendar</h1><p class="muted">Completed days turn fully gold when all daily guide steps are finished. Tap a day to open its exercises. F = Flow, M = Mobility, S = Strength, B = Bike, 🏃 = Running, R = Recovery.</p><div class="card"><div class="between"><button class="action" onclick="setDate('${fmt(prev)}')">‹</button><h2>${safe(selected.toLocaleDateString('en-US',{month:'long',year:'numeric'}))}</h2><button class="action" onclick="setDate('${fmt(next)}')">›</button></div><div class="cal-grid">${['M','T','W','T','F','S','S'].map(x=>`<div class="cal-head">${x}</div>`).join('')}${cells}</div></div>${roadmap()}<div class="card"><h2>Weekly training structure</h2><p><strong>Mon:</strong> Flow + scheduled bike/run (optional if needed)</p><p><strong>Tue:</strong> Mobility Flow + Upper A</p><p><strong>Wed:</strong> Flow + scheduled bike/run</p><p><strong>Thu:</strong> Mobility Flow + Upper B</p><p><strong>Fri:</strong> Flow + scheduled longer bike/run</p><p><strong>Sat:</strong> Lower-body strength</p><p><strong>Sun:</strong> Recovery / optional walking</p><div class="note">Use pain-tolerated ranges and adjust training volume based on recovery. Sunday recovery can be checked off as completed without earning XP.</div></div>`}
function openDay(iso){state.selected=iso;state.view='workout';save();render();window.scrollTo(0,0)}
function progress(){let x=xpTotal(),count=Object.values(state.dates).reduce((n,d)=>n+Object.values(d.checks||{}).filter(Boolean).length,0),levels=DATA.backLevels;return `${header()}<h1>Your journey</h1><p class="muted">Completed days, XP and back-extension progress.</p>${roadmap()}<div class="card"><div class="between"><h2>Level ${lvl()}</h2><strong class="accent">${x} XP</strong></div><div class="progress"><div style="width:${x%500/5}%"></div></div><p class="muted">${500-x%500} XP until your next level</p><div class="statrow"><div class="stat"><strong>${Object.keys(state.dates).filter(dayCompleted).length}</strong><small>Days completed</small></div><div class="stat"><strong>${count}</strong><small>Checks</small></div><div class="stat"><strong>${state.backDeposits.length}</strong><small>Back deposits</small></div></div></div><div class="card"><h2>Back extension progression</h2><p class="muted">Progress manually. Keep Level 1 until the hold is comfortable. The program advises at least 10 deposits per duration increase and 3 consecutive symptom-stable weeks before progression.</p>${levels.map((v,i)=>`<div class="exercise"><span class="pill">${i+1}</span><div class="exbody"><strong>${safe(v.name)}</strong><small>${safe(v.target)}</small></div><button class="action ${state.level===i+1?'primary':'ghost'}" onclick="chooseLevel(${i+1})">${state.level===i+1?'Current':'Select'}</button></div>`).join('')}<h3>Recent deposits</h3>${state.backDeposits.slice(-8).reverse().map(v=>`<div class="between"><span>${safe(v.date)} · L${v.level}</span><strong>${safe(v.result)}</strong></div>`).join('')||'<p class="muted">No deposits recorded yet.</p>'}</div></div>`}
function chooseLevel(n){if(n!==state.level&&!confirm('Change your back-extension level? Progress only after the previous level feels comfortable.'))return;state.level=n;save();render()}
function clearAllProgress(){
 if(!confirm('Clear ALL saved progress on this device? This deletes workout logs, habits, XP, completed days, and back-extension records. This cannot be undone unless you exported a backup.'))return;
 const phrase=prompt('To confirm permanent deletion, type CLEAR exactly:');
 if(phrase!=='CLEAR'){alert('Progress was not cleared.');return;}
 try{localStorage.removeItem(KEY)}catch(e){alert('Could not clear browser storage.');return;}
 location.reload();
}
function settings(){return `${header()}<h1>Settings & backup</h1><div class="card"><h2>Goals</h2><div class="grid2"><label>Daily water (oz)<input class="input" type="number" min="16" max="200" value="${state.waterGoal}" onchange="field('waterGoal',Number(this.value))"></label></div><label>Program start date<input class="input" type="date" value="${safe(state.start)}" onchange="field('start',this.value)"></label></div><div class="card"><h2>Your data</h2><p class="muted">This HTML preview saves data in this browser's local storage. It does not sync across devices. Export regularly before replacing the app.</p><div class="row"><button class="action primary" onclick="exportData()">Export JSON backup</button><label class="action ghost">Import JSON<input type="file" accept="application/json" style="display:none" onchange="importData(this.files[0])"></label></div></div><div class="card"><h2>Clear all progress</h2><p class="muted">Permanently delete saved workouts, habits, XP, completed days, and back-extension deposits on this device. Your workout plan and app settings return to defaults. Export a backup first if you want to keep your records.</p><button class="action" style="border-color:#c65b5b;color:#ffb3b3;background:#341a1a" onclick="clearAllProgress()">Clear all progress…</button></div><div class="card"><h2>About this preview</h2><p class="muted">Chris's App · black + green · mobile-first · no notifications. This standalone HTML is for review. The final GitHub Pages release will include installable PWA files and offline caching.</p><p class="foot">Exercise prescriptions are based on the information you supplied from your program. This is not an official Low Back Ability app. Stop or modify activities that aggravate symptoms and consider a sports physical therapist for persistent knee/hip pain.</p></div>`}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='chris-app-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importData(file){if(!file)return;try{let d=JSON.parse(await file.text());if(!d||typeof d!=='object'||!d.dates)throw Error('Not a valid backup');if(!confirm('Replace current app data with this backup?'))return;state=d;save();render()}catch(e){alert('Import failed: '+e.message)}}
function render(){let pages={home,workout,habits:habitsPage,plan,progress,settings};document.getElementById('app').innerHTML=(pages[state.view]||home)();document.getElementById('nav').innerHTML=[['home','◎','Today'],['workout','▣','Workout'],['plan','▦','Calendar'],['progress','↗','Progress'],['settings','⚙','Settings']].map(([id,icon,name])=>`<button class="${state.view===id?'active':''}" onclick="navTo('${id}')"><b>${icon}</b>${name}</button>`).join('')}
render();
</script><script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(err => console.warn('Offline registration unavailable',err)));}</script></body></html>
