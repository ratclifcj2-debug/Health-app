g:9px 12px;border-radius:10px;font-weight:750}.action.primary{background:var(--green);color:#06210f;border-color:var(--green)}.action.ghost{border-color:var(--line);background:transparent;color:var(--text)}.nav{position:fixed;bottom:0;left:0;right:0;background:#101711f5;border-top:1px solid var(--line);display:flex;justify-content:center;padding:7px 4px max(8px,env(safe-area-inset-bottom));z-index:10}.nav button{width:25%;max-width:170px;background:none;color:var(--muted);border:0;padding:8px 2px;font-size:12px}.nav button.active{color:var(--green);font-weight:800}.nav b{display:block;font-size:21px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.habit{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:10px 0}.habit label{flex:1}.habit small{display:block;color:var(--muted)}.input{background:#0b120e;color:var(--text);border:1px solid #3b5141;border-radius:9px;padding:10px;width:100%;min-width:0}.tiny{width:85px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{padding:10px 1px;border:1px solid var(--line);border-radius:11px;text-align:center;background:#0e1510;color:var(--text)}.day.selected{border-color:var(--green);background:#193522}.day small{display:block;color:var(--muted);font-size:10px}.day strong{font-size:14px}.detail{padding:12px 0;border-top:1px solid var(--line)}.detail summary{cursor:pointer;font-weight:700}.detail p{font-size:13px;color:#cad5cc}.sets{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 35px;gap:7px;align-items:center;margin:8px 0}.sets .input{padding:8px 5px;text-align:center}.note{background:#142b1c;border-left:3px solid var(--green);padding:11px;border-radius:8px;font-size:13px;color:#cde8d5}.plan-day{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);padding:13px 2px;background:transparent;color:var(--text)}.plan-day.selected{background:#163421;border-radius:8px;padding-left:8px;padding-right:8px}.plan-day small{display:block;color:var(--muted);margin-top:3px}.plan-day .accent{white-space:nowrap;font-size:12px}.habit label{cursor:pointer}.hide{display:none}.award{padding:11px;border:1px solid var(--line);border-radius:12px;margin:7px 0}.award.unlocked{border-color:#448a5a;background:#17321f}.large{font-size:25px;font-weight:800}.foot{font-size:12px;color:var(--muted)}@media(min-width:700px){.card{padding:22px}.gridDesktop{display:grid;grid-template-columns:1fr 1fr;gap:13px}.gridDesktop .card{margin-bottom:0}}

 .guide-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin:12px 0}.guide-card{padding:23px 18px;min-height:300px}.guide-card h1{margin:12px 0}.guide-meta{font-size:12px;color:var(--green);font-weight:800;text-transform:uppercase;letter-spacing:.6px}.guide-controls{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:22px;flex-wrap:wrap}.guide-controls .action:disabled{opacity:.3;cursor:default} .nav button{font-size:11px} </style><style>.cal-cell{aspect-ratio:1/1;position:relative;justify-content:center;padding:4px 1px;gap:3px}.cal-cell.done{background:#d9a72c;border-color:#ffe08a;color:#241a00;box-shadow:inset 0 0 0 1px #ffe08a}.cal-cell.done strong{color:#241a00}.cal-cell.done span{color:#4a3500}.cal-cell span{font-size:9px}.cal-empty{aspect-ratio:1/1}@media(max-width:380px){.cal-grid{gap:3px}.cal-cell strong{font-size:13px}.cal-cell span{font-size:8px}}</style></head><body><main id="app"></main><nav class="nav" id="nav"></nav><script>
const DATA={"flow":[{"name":"Sled Warm Up","dose":"1 × 10 m","targets":"Arch of foot, calves, quads, glutes","how":"Start with backward sled work; later gradually add push/pull up to twice weekly. No sled: backward walking or carefully walking backward on an unpowered treadmill.","standard":"Bodyweight backwards walk"},{"name":"Tibialis Raise","dose":"2 × 25","targets":"Tibialis anterior","how":"Hips against wall, heels about 12 inches out. Lift toes toward shins.","standard":"None"},{"name":"Deep Calf Raise","dose":"2 × 25","targets":"Soleus","how":"Hands on wall; bend knees over toes with heels down, then raise onto toes while keeping knees forward.","standard":"Backwards walking · Goal: single leg × 25"},{"name":"Reverse Step Up","dose":"2 × 25 / side","targets":"Quadriceps / VMO","how":"Extend one leg about 6 inches ahead. Bend standing knee until extended heel taps floor; pause one second and stand.","standard":"Deep calf raise · Goal: 25 reps at 12 inches"},{"name":"Full Range Split Squats","dose":"2 × 10 / side","targets":"Psoas, quads, glutes, soleus","how":"Elevate front foot, feet hip-width. Lower with upright torso and straighter back leg only as far as comfortably tolerated.","standard":"Reverse step up · Goal: active straight back leg"},{"name":"External Rotation","dose":"1 × 15 / side","targets":"Teres minor, infraspinatus","how":"With light dumbbell or empty arm, lower forearm until wrist approaches/below elbow, only within comfortable range; rotate up.","standard":"Active hang · Goal: full-range pain-free reps"},{"name":"Pullover","dose":"2 × 15","targets":"Thoracic spine, shoulders, upper back","how":"Lie across bench at shoulder blades. Hold dumbbell in both hands; lower extended arms behind head, then return.","standard":"Active hang · Goal: hands below shoulders"},{"name":"Trap 3 Raise","dose":"2 × 10","targets":"Lower trapezius","how":"Knees wide, hinge slightly, raise arms into Y with thumbs back. Progress to chest on incline bench, optional light dumbbells.","standard":"Pullover · Goal: full low-trap engagement"},{"name":"Back Extensions","dose":"Level-specific","targets":"Spinal erectors, intraspinal muscles","how":"Begin at Level 1, with a high pad and assistance. Use next-day response to guide deposits and progression.","standard":"Trap 3 Raise · Goal: all levels without flare-up"},{"name":"Hip Flexor Kick Out","dose":"2 × 5 / side · 5s hold","targets":"Hip flexors / psoas","how":"Use wall support. Lift knee, extend leg and hold 5 seconds without rounding back. Regress to bent-knee holds.","standard":"Goal: 2 sets × 5 × 5s per leg"},{"name":"Side Bend","dose":"2 × 12 / side","targets":"Quadratus lumborum","how":"Stagger feet slightly, light dumbbell beside front leg, other hand behind head. Bend strictly sideways through a gentle range.","standard":"Start with small comfortable range"}],"mob":[{"name":"Couch Stretch","dose":"2 × 1 min / side","targets":"Rectus femoris, hip flexors","how":"Back knee by couch/wall, front foot planted. Slowly bring torso upright to comfortable thigh/hip stretch.","standard":""},{"name":"Fire Hydrants","dose":"1 × 10 CW + 10 CCW / side","targets":"Glute medius/minimus, TFL","how":"On hands and knees, draw controlled circles with raised knee. Keep torso still; avoid grinding through clicks.","standard":""},{"name":"Hip Abduction","dose":"1 × 10 / side","targets":"Glute medius/minimus, TFL","how":"On all fours, raise bent knee to side, lower with control; stabilize torso.","standard":"After fire hydrants"},{"name":"90/90 Rotation","dose":"1 × 10 / side","targets":"Outer hip rotators","how":"Sit 90/90 with hands behind for support. Lift back heel, rotate toward front heel and return. Long-term goal: no hands.","standard":""},{"name":"Outer Hip Dropset","dose":"1 full dropset / side","targets":"Glute med/min, piriformis, TFL","how":"Three stages back to back: internal rotation 30s, lifted knee and foot 30s, kickout 30s; repeat other side.","standard":"90 seconds each side"},{"name":"Pigeon Strength","dose":"1 × 20 / side","targets":"Piriformis, outer glutes","how":"Front knee ~45° on incline bench, back leg straight. Press knee into bench to raise body. Increase incline to regress.","standard":"Hands-free at appropriate incline"},{"name":"Deep Squats","dose":"2 × 2 min","targets":"Quads, glutes, hamstrings, ankles","how":"Feet hip-width; squat with back straight, knees over toes; stand through heels. Confirm whether 2 min is holds or repeated reps.","standard":"Duration format from source; execution needs clarification"},{"name":"Loaded Butterfly","dose":"2 × 1 min","targets":"Inner thigh, groin, hips","how":"Sit soles together; gently press knees down with hands/light dumbbells, then actively lift. Elevate seat if back rounds.","standard":""},{"name":"Active Hangs","dose":"1 × 1 min","targets":"Shoulders, grip, core","how":"Hang with both hands, engage abdominals, relax shoulders; focus on shoulder adaptation, not passive spine decompression.","standard":""}],"strength":{"1":[{"name":"Barbell Bench Press","dose":"3 × 6–8","targets":"Chest, triceps, front delts","how":"Set safety bars or use a spotter. Plant feet, maintain a stable upper back, lower bar under control toward mid-chest, and press without bouncing. Start with 2 working sets for the first 2 weeks.","standard":"Leave ~2–3 reps in reserve; increase load only after all sets reach 8 clean reps."},{"name":"Single-arm Dumbbell Row","dose":"3 × 8–12 / side","unilateral":true,"targets":"Lats, upper back; left/right balance","how":"Support one hand and knee on bench, brace torso, pull elbow toward hip without twisting. Begin with the weaker side and match reps on the stronger side.","standard":"Log both sides separately; avoid compensatory torso rotation."},{"name":"Pull-ups / Band-assisted Pull-ups","dose":"3 × 5–10","targets":"Lats, upper back, biceps","how":"Use a secure bar and assistance band as needed. Begin from an active shoulder position, pull with controlled range, lower smoothly. Record assistance in notes if used.","standard":"Choose assistance that allows clean repetitions; do not force painful shoulder positions."},{"name":"Dumbbell Lateral Raise","dose":"2 × 12–20","targets":"Side deltoids; shoulder width","how":"Use light dumbbells, soft elbows, raise arms roughly to shoulder height in a comfortable plane. Avoid swinging or shrugging.","standard":"Controlled repetitions, no momentum."},{"name":"Band Pallof Press","dose":"2 × 10–12 / side","unilateral":true,"targets":"Anti-rotation core control","how":"Anchor band securely at chest height. Stand side-on, press hands straight forward while resisting rotation. Repeat facing the other direction.","standard":"Equal controlled reps on each side."}],"3":[{"name":"Incline Dumbbell Press","dose":"3 × 8–12","targets":"Upper chest, front delts, triceps","how":"Set bench to a moderate incline (~15–30°). Lower dumbbells with control, keep wrists stacked, and press without bouncing.","standard":"Use an incline and range comfortable for shoulders."},{"name":"Chest-supported Dumbbell Row","dose":"3 × 8–12","targets":"Mid-back, lats, rear delts","how":"Lie chest-down on an inclined bench. Row dumbbells toward ribs while keeping chest supported; pause briefly and lower slowly.","standard":"Avoid using lower-back momentum."},{"name":"Pull-ups / Band-assisted Pull-ups","dose":"2 × 5–10","targets":"Lats, biceps","how":"Use a secure bar and band assistance as needed; controlled upward and downward phases.","standard":"Quality and full comfortable range before adding reps."},{"name":"Single-arm Dumbbell Lateral Raise","dose":"2 × 12–15 / side","unilateral":true,"targets":"Side deltoids; left/right balance","how":"Stand tall with light dumbbell, lift arm in a comfortable arc to about shoulder height, lower slowly. Start weaker side, match stronger.","standard":"Record left and right independently."},{"name":"Hammer Curl","dose":"2 × 10–15","targets":"Biceps, brachialis, forearms","how":"Neutral grip with palms facing in. Keep upper arms near sides and lower under control without swinging.","standard":"Use controlled full comfortable range."},{"name":"Band Triceps Pressdown","dose":"2 × 10–15","targets":"Triceps","how":"Anchor band securely overhead, keep elbows close to sides, extend forearms without swinging shoulders.","standard":"Increase band tension only when reps are controlled."}],"6":[{"name":"Barbell Romanian Deadlift","dose":"3 × 6–10","targets":"Hamstrings, glutes, posterior chain","how":"Stand with bar near thighs, soften knees, push hips backward keeping bar close, stop before losing neutral trunk position, then drive hips forward. Start light and reduce range if glute/back symptoms increase.","standard":"Do not chase depth or load at expense of control."},{"name":"Supported Split Squat / Low Step-up","dose":"2 × 8–10 / side","unilateral":true,"targets":"Quads, glutes, single-leg stability","how":"Use rack upright for support. Choose a low step or shortened split squat with a comfortable knee range. Start on the less capable side and match the other side.","standard":"Pain-tolerated range; reduce or skip if knee/glute symptoms worsen."},{"name":"Banded Hamstring Curl","dose":"2 × 10–15","targets":"Hamstrings (knee flexion)","how":"Anchor band securely, curl heel toward glutes with hips stable, return slowly. Use standing or lying position according to your setup.","standard":"Smooth controlled repetitions."},{"name":"Side-lying Hip Abduction","dose":"2 × 12–15 / side","unilateral":true,"targets":"Glute medius/minimus, hip control","how":"Lie on side with top leg straight and slightly behind torso, lift without rolling pelvis backward; lower slowly.","standard":"Match clean reps side to side; avoid painful range."},{"name":"Dead Bug","dose":"2 × 10 / side","unilateral":true,"targets":"Trunk stability, anti-extension","how":"Lie on back with knees and arms up, brace gently, extend opposite arm and leg slowly while keeping lower back stable; alternate sides.","standard":"Only extend as far as you can control."}]},"backLevels":[{"name":"Iso Holds","target":"2 min double-leg hold","unit":"seconds","goal":120},{"name":"Single Leg Iso Holds","target":"1 min each side","unit":"seconds per side","goal":60},{"name":"Assisted Hinge Reps","target":"10–15 smooth half-range reps","unit":"reps","goal":15},{"name":"Full Range Reps","target":"30 controlled reps","unit":"reps","goal":30},{"name":"Single Leg Reps","target":"20 per side","unit":"reps per side","goal":20},{"name":"Weighted Reps","target":"12 loaded double-leg reps","unit":"reps","goal":12}]};
const KEY='chris-app-preview-v2';
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const addDays=(iso,n)=>{let d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const weekDay=(iso)=>new Date(iso+'T12:00:00').getDay();
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state;try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}state??={start:'2026-11-23',dates:{},level:1,habits:{},waterGoal:90,vitamins:'Vitamins / supplements (as appropriate)',view:'home',selected:today(),backDeposits:[],customExercises:[]};state.dates??={};state.habits??={};state.backDeposits??=[];state.customExercises??=[];state.selected??=today();state.view??='home';
if(!state.strengthProgramV2){for(const d of Object.values(state.dates||{})){for(const k of Object.keys(d.checks||{}))if(k.startsWith('strength:'))delete d.checks[k];for(const k of Object.keys(d.sets||{}))if(k.startsWith('strength:'))delete d.sets[k]}state.strengthProgramV2=true;}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('Storage unavailable: export backups regularly.')}};
const day=()=>state.dates[state.selected]??(state.dates[state.selected]={checks:{},sets:{},values:{}});
const wd=()=>weekDay(state.selected), flowDay=()=>[1,3,5].includes(wd()),mobDay=()=>[2,4].includes(wd());
const strengthIndex=dow=>({2:1,4:3,6:6})[dow];
const wk=(iso=state.selected)=>Math.max(1,Math.min(24,Math.floor((new Date(iso+'T12:00:00')-new Date(state.start+'T12:00:00'))/604800000)+1));
const cardio=(iso=state.selected)=>{let d=weekDay(iso),w=wk(iso);if(![1,3,5].includes(d))return null;let minutes=d===1?'15–20 min':d===3?'20–25 min':'25–40 min';return {name:'Easy bike trainer',dose:minutes,desc:'Easy conversational effort. Monday is optional if the early start makes it impractical. Gradually transition to run/walk only when symptoms permit.'}};
const planned=(iso=state.selected)=>{let a=[],dow=weekDay(iso),si=strengthIndex(dow);if([1,3,5].includes(dow))a.push({id:'flow',name:'Low Back Ability · Flow',count:11,xp:100});if([2,4].includes(dow))a.push({id:'mob',name:'Low Back Ability · Mobility Flow',count:9,xp:60});if(si!==undefined)a.push({id:'strength',name:(dow===2?'Upper A':dow===4?'Upper B':'Lower + Core')+' · strength',count:DATA.strength[si].length,xp:75});if(cardio(iso))a.push({id:'cardio',name:cardio(iso).name,count:1,xp:75});if(!a.length)a.push({id:'rest',name:'Recovery / optional walk',count:1,xp:0});return a};
const itemList=(type)=>type==='flow'?DATA.flow:type==='mob'?DATA.mob:type==='strength'?(DATA.strength[strengthIndex(wd())]||[]):type==='cardio'?[{...cardio(),how:cardio()?.desc,targets:'Endurance',standard:''}]:[{name:'Rest / easy movement',dose:'As needed',how:'Recovery is part of the plan.',targets:'Recovery',standard:''}];
const doneCount=(type)=>itemList(type).filter((e,i)=>day().checks[type+':'+i]).length;
const completed=(p)=>doneCount(p.id)===p.count;
const xpDate=(iso)=>{const d=state.dates[iso];if(!d)return 0;let xp=0;for(const p of planned(iso)){let n=0;for(let i=0;i<p.count;i++)if(d.checks?.[p.id+':'+i])n++;xp+=Math.round(p.xp*n/p.count)}for(const [id] of habits)if(d.checks?.['habit:'+id])xp+=5;if(Number(d.values?.water)>=state.waterGoal)xp+=20;return xp};
const xpTotal=()=>Object.keys(state.dates).reduce((n,d)=>n+xpDate(d),0),lvl=()=>1+Math.floor(xpTotal()/500);
const habits=[['protein','Protein drink','After morning workout · 25–35 g'],['mealshake','Meal replacement','10:00 AM · balanced meal'],['lunch','Lunch','1:00 PM · protein + produce'],['dinner','Dinner','6:30 PM · protein + vegetables'],['vitamins','Vitamins / supplements','Only those you choose or have been advised to take'],['brusham','Brush teeth · morning','Fluoride toothpaste'],['brushpm','Brush teeth · evening','Fluoride toothpaste'],['floss','Floss','Once daily'],['hygiene','Basic hygiene','Wash / shower as needed, clean clothes'],['walkam','Morning walk','10–15 min on workdays'],['walkpm','Afternoon walk','10–15 min on workdays'],['desk','Desk mobility','2–5 min on workdays']];
const applicableHabits=(iso=state.selected)=>habits.filter(([id])=>!["walkam","walkpm","desk"].includes(id)||[1,2,3,4,5].includes(weekDay(iso)));
const habitProgress=(iso=state.selected)=>{const d=state.dates[iso]||{checks:{},values:{}};let items=applicableHabits(iso),done=items.filter(([id])=>d.checks?.['habit:'+id]).length;let water=Number(d.values?.water||0)>=Number(state.waterGoal);return {done:done+Number(water),total:items.length+1,water}};

function check(id,val){day().checks[id]=val;save();render()}
function value(id,val){day().values[id]=val;save();render()}
function field(k,val){state[k]=val;save();render()}
function showAllHabits(){navTo('habits')}
function navTo(v){state.view=v;if(v==='home')guideIndex=Math.max(0,guideSteps().findIndex(s=>!stepDone(s)));save();render();window.scrollTo(0,0)}
function setDate(iso){state.selected=iso;save();render()}
function title(s){return `<div class="sectionlabel">${safe(s)}</div>`}
function checkrow(id,name,desc){return `<div class="habit"><input id="h_${id.replace(/[^a-zA-Z0-9]/g,'_')}" aria-label="${safe(name)}" class="check" type="checkbox" ${day().checks[id]?'checked':''} onchange="check('${id}',this.checked)"><label for="h_${id.replace(/[^a-zA-Z0-9]/g,'_')}"><strong>${safe(name)}</strong><small>${safe(desc)}</small></label></div>`}
function header(){let x=xpTotal(),n=lvl();return `<div class="top"><div><div class="brand">Chris's <span>App</span></div><div class="sub">STRONGER · HEALTHIER · FASTER</div></div><span class="pill">⚡ LEVEL ${n}</span></div>`}
function weekstrip(){let d=new Date(state.selected+'T12:00:00'),monday=new Date(d);monday.setDate(d.getDate()-((d.getDay()+6)%7));let h='';for(let i=0;i<7;i++){let t=new Date(monday);t.setDate(monday.getDate()+i);let iso=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');h+=`<button class="day ${iso===state.selected?'selected':''}" onclick="setDate('${iso}')"><small>${['M','T','W','T','F','S','S'][i]}</small><strong>${t.getDate()}</strong></button>`}return `<div class="week">${h}</div>`}
function guideSteps(iso=state.selected){
 const list=applicableHabits(iso), steps=[];
 const habit=id=>{const h=list.find(x=>x[0]===id);if(h)steps.push({key:'habit:'+id,kind:'habit',name:h[1],detail:h[2],session:'Daily habits'})};
 // The guide follows a normal day, not the order of keys in storage.
 habit('brusham');
 const sessions=planned(iso).filter(p=>p.id!=='rest');
 if(sessions.length){
  steps.push({key:'prep',kind:'check',name:'Pre-workout preparation',detail:'Hydrate, check knee/glute symptoms, and warm up gently for 3–5 minutes. Adjust anything that increases symptoms.',session:'Before training'});
  for(const p of sessions)steps.push({key:'session:'+p.id,kind:'session',type:p.id,name:p.name,detail:p.id==='cardio'?cardio(iso)?.dose:p.count+' exercises',session:'Training'});
  steps.push({key:'post',kind:'check',name:'Post-workout recovery',detail:'Cool down as needed and check how you feel.',session:'After training'});
  habit('protein');
 }else{
  steps.push({key:'recovery',kind:'check',name:'Recovery day check-in',detail:'Rest, or take an optional comfortable walk. Recovery counts.',session:'Recovery'});
 }
 habit('hygiene');habit('vitamins');habit('mealshake');habit('walkam');habit('lunch');habit('desk');habit('walkpm');
 habit('dinner');habit('brushpm');habit('floss');
 // Hydration is a cumulative all-day goal; place its final check toward the evening.
 steps.push({key:'water',kind:'water',name:'Daily hydration total',detail:state.waterGoal+' oz target · log water throughout the day',session:'All-day goal'});
 return steps;
}
function stepDone(s){if(s.kind==='water')return Number(day().values.water||0)>=state.waterGoal;if(s.kind==='session')return planned().find(p=>p.id===s.type)?.count===doneCount(s.type);return !!day().checks[s.key]}

function dayCompleted(iso){
 const d=state.dates[iso];if(!d||iso>today())return false;
 return guideSteps(iso).every(s=>{
  if(s.kind==='water')return Number(d.values?.water||0)>=Number(state.waterGoal);
  if(s.kind==='session')return planned(iso).filter(p=>p.id===s.type).every(p=>Array.from({length:p.count},(_,i)=>Boolean(d.checks?.[p.id+':'+i])).every(Boolean));
  return Boolean(d.checks?.[s.key]);
 });
}
let guideIndex=0;
function guideMove(n){guideIndex=Math.max(0,Math.min(guideSteps().length-1,n));render();window.scrollTo(0,0)}
function guideToggle(){let steps=guideSteps(),s=steps[guideIndex];if(!s||s.kind==='water')return;day().checks[s.key]=!day().checks[s.key];save();if(day().checks[s.key]&&guideIndex<steps.length-1)guideIndex++;render()}
function guideNext(){guideMove(guideIndex+1)}
function guidePrevious(){guideMove(guideIndex-1)}
function home(){
 const steps=guideSteps();guideIndex=Math.max(0,Math.min(guideIndex,steps.length-1));
 const done=steps.filter(stepDone).length,s=steps[guideIndex],percent=Math.round(100*done/steps.length);
 let body='';
 if(s.kind==='session'){
 const p=planned().find(x=>x.id===s.type),n=doneCount(s.type);
 body=`<div class="guide-meta">${safe(s.session)} · ${safe(s.detail)}</div><h1>${safe(s.name)}</h1><p class="muted">${n} of ${p.count} exercises completed. Open this workout to see each exercise, full form instructions, sets and logging.</p><button class="action primary" onclick="navTo('workout')">Open workout →</button><p class="foot">When all exercises are checked off, this step completes automatically.</p>`;
 }else if(s.kind==='water'){
 body=`<div class="guide-meta">Hydration</div><h1>${safe(s.name)}</h1><p>${safe(day().values.water||0)} / ${state.waterGoal} oz</p><div class="progress"><div style="width:${Math.min(100,100*(Number(day().values.water)||0)/state.waterGoal)}%"></div></div><div class="row" style="margin-top:16px"><button class="action" onclick="waterAdd(8)">+8 oz</button><button class="action" onclick="waterAdd(16)">+16 oz</button><button class="action ghost" onclick="waterAdd(-8)">−8 oz</button></div>`;
 }else{
 body=`<div class="guide-meta">${safe(s.session)}</div><h1>${safe(s.name)}</h1><p class="muted">${safe(s.detail)}</p>`;
 }
 const control=(s.kind==='water'||s.kind==='session')?`<span class="${stepDone(s)?'accent':'muted'}">${stepDone(s)?'✓ Complete':'Complete this step using the controls above'}</span>`:`<button class="action ${stepDone(s)?'ghost':'primary'}" onclick="guideToggle()">${stepDone(s)?'✓ Completed · Undo':'✓ Mark complete & continue'}</button>`;
 return `${header()}<div class="between" style="margin-bottom:12px"><div><div class="sub">${safe(new Date(state.selected+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}))}</div><h1>Today's guide</h1></div><span class="pill">${done}/${steps.length} done</span></div><div class="progress"><div style="width:${percent}%"></div></div><div class="guide-top"><span>STEP ${guideIndex+1} OF ${steps.length}</span><span>${percent}% complete</span></div><div class="card guide-card">${body}<div class="guide-controls">${control}</div><div class="guide-controls"><button class="action ghost" onclick="guidePrevious()" ${guideIndex===0?'disabled':''}>← Back</button><button class="action ghost" onclick="guideNext()" ${guideIndex===steps.length-1?'disabled':''}>Next →</button></div></div><div class="card"><div class="between"><div><h2>Jump to a step</h2><p class="sub">You can revisit any step.</p></div><button class="action ghost" onclick="guideMove(${Math.max(0,steps.findIndex(x=>!stepDone(x)))})">Next unfinished</button></div><select class="input" aria-label="Choose daily step" onchange="guideMove(Number(this.value))">${steps.map((x,i)=>`<option value="${i}" ${i===guideIndex?'selected':''}>${stepDone(x)?'✓ ':''}${i+1}. ${safe(x.name)}</option>`).join('')}</select></div><div class="card"><div class="between"><div><strong>Daily habits</strong><div class="sub">${habitProgress().done}/${habitProgress().total} habits completed</div></div><button class="action" onclick="navTo('habits')">See all habits →</button></div></div>`;
}
function waterAdd(n){day().values.water=Math.max(0,(Number(day().values.water)||0)+n);save();render()}
function exerciseBlock(e,type,i){let id=type+':'+i,sets=day().sets[id]||[],dose=e.name==='Back Extensions'?DATA.backLevels[state.level-1].target:e.dose;let html=`<div class="card"><div class="between"><div><div class="sub">EXERCISE ${i+1} / ${itemList(type).length}</div><h2>${safe(e.name)}</h2><div class="muted">${safe(dose)}</div></div><input class="check" type="checkbox" aria-label="Complete ${safe(e.name)}" ${day().checks[id]?'checked':''} onchange="check('${id}',this.checked)"></div><details class="detail"><summary>Instructions & form</summary><p>${safe(e.how||e.desc||'')}</p>${e.targets?`<div class="sub">TARGET: ${safe(e.targets)}</div>`:''}${e.standard?`<div class="sub">PREREQUISITE / GOAL: ${safe(e.standard)}</div>`:''}</details>`;
if(e.name==='Back Extensions'){let lev=DATA.backLevels[state.level-1];html+=`<div class="note"><strong>Level ${state.level} · ${safe(lev.name)}</strong><br>${safe(lev.target)}<br>Start conservatively. At Level 1, aim for at least 10 successful deposits at a duration before adding time, with stable next-day response. Do not progress automatically.</div><div class="row" style="margin-top:12px"><label>Actual ${safe(lev.unit)}<input class="input tiny" inputmode="decimal" type="number" min="0" id="backActual" value="${safe(day().values.backActual||'')}"></label><button class="action" onclick="recordBack()">Record deposit</button></div><label class="row" style="margin-top:10px"><input type="checkbox" ${day().values.backNextDay==='yes'?'checked':''} onchange="value('backNextDay',this.checked?'yes':'')"> Next-day response stable (check tomorrow)</label><button class="action ghost" style="margin-top:10px" onclick="navTo('progress')">View back levels →</button>`}
else if(type==='strength'){let num=Number((e.dose.match(/^\d+/)||['2'])[0]);html+=`<div class="note">${safe(e.standard||'')}<br><strong>First 2 weeks:</strong> begin with 2 working sets, then build toward the listed prescription if recovery is good. Aim for 2–3 reps in reserve.</div>`;let prev=previousStrength(id);if(prev)html+=`<div class="sub" style="margin-top:10px">PREVIOUS SESSION: ${safe(prev)}</div>`;if(e.unilateral){html+=`<div class="sub" style="margin-top:12px">LOG EACH SIDE · WEIGHT (LB) · REPS</div>`;for(let j=0;j<num;j++){let st=sets[j]||{};html+=`<div class="sub" style="margin-top:12px">SET ${j+1}</div>`;for(const side of ['L','R']){html+=`<div class="sets"><strong>${side}</strong><input aria-label="${side} weight set ${j+1}" class="input" inputmode="decimal" type="number" min="0" placeholder="lb" value="${safe(st['w'+side]??'')}" onchange="setEntry('${id}',${j},'w${side}',this.value)"><input aria-label="${side} reps set ${j+1}" class="input" inputmode="numeric" type="number" min="0" placeholder="reps" value="${safe(st['r'+side]??'')}" onchange="setEntry('${id}',${j},'r${side}',this.value)"><input aria-label="${side} done set ${j+1}" class="check" type="checkbox" ${st['ok'+side]?'checked':''} onchange="setEntry('${id}',${j},'ok${side}',this.checked)"></div>`}}}else{html+=`<div class="sub" style="margin-top:12px">SET · WEIGHT (LB) · REPS · DONE</div>`;for(let j=0;j<num;j++){let st=sets[j]||{};html+=`<div class="sets"><strong>${j+1}</strong><input aria-label="Weight for set ${j+1}" class="input" inputmode="decimal" type="number" min="0" placeholder="lb" value="${safe(st.w??'')}" onchange="setEntry('${id}',${j},'w',this.value)"><input aria-label="Reps for set ${j+1}" class="input" inputmode="numeric" type="number" min="0" placeholder="reps" value="${safe(st.r??'')}" onchange="setEntry('${id}',${j},'r',this.value)"><input aria-label="Complete set ${j+1}" class="check" type="checkbox" ${st.ok?'checked':''} onchange="setEntry('${id}',${j},'ok',this.checked)"></div>`}}}
else if(type==='cardio'){html+=`<div class="row" style="margin-top:12px"><label>Minutes<input class="input tiny" type="number" min="0" value="${safe(day().values.cardioMin||'')}" onchange="value('cardioMin',this.value)"></label><label>Distance (mi)<input class="input tiny" type="number" step=".1" min="0" value="${safe(day().values.cardioMiles||'')}" onchange="value('cardioMiles',this.value)"></label></div>`}else if(/\b(min|sec|m\b|seconds|hold)/i.test(dose)){html+=`<div class="row" style="margin-top:12px"><button class="action ghost" onclick="timerStart(60)">Start 1-min timer</button><button class="action ghost" onclick="timerStart(30)">30-sec timer</button><span id="timerDisplay" class="accent"></span></div>`}return html+'</div>'}
function previousStrength(id){let dates=Object.keys(state.dates||{}).filter(d=>d<state.selected).sort().reverse();for(const iso of dates){let a=state.dates[iso]?.sets?.[id];if(a?.length){let st=a.find(x=>x&&(x.w||x.r||x.wL||x.rL||x.wR||x.rR));if(st)return st.wL!==undefined||st.rL!==undefined?`L ${st.wL||'–'} lb × ${st.rL||'–'}, R ${st.wR||'–'} lb × ${st.rR||'–'}`:`${st.w||'–'} lb × ${st.r||'–'}`}}return ''}
function setEntry(id,j,k,v){day().sets[id]??=[];day().sets[id][j]??={};day().sets[id][j][k]=v;save()}
function recordBack(){let n=Number(document.getElementById('backActual').value);if(!(n>0)){alert('Enter a positive result first.');return}day().values.backActual=n;state.backDeposits.push({date:state.selected,level:state.level,result:n});save();render()}
let interval=null;function timerStart(n){clearInterval(interval);let left=n;let el=document.getElementById('timerDisplay');if(!el)return;el.textContent=left+'s';interval=setInterval(()=>{left--;if(el)el.textContent=left>0?left+'s':'Done ✓';if(left<=0)clearInterval(interval)},1000)}
function workout(){let ps=planned();return `${header()}<h1>Today's workout</h1><p class="muted">${safe(state.selected)} · Week ${wk()} · Check off each exercise as you finish.</p>${weekstrip()}${ps.map(p=>`${title(p.name)}<div class="between" style="margin-bottom:10px"><span class="muted">${doneCount(p.id)} / ${p.count} complete</span><span class="accent">+${p.xp} XP</span></div>${itemList(p.id).map((e,i)=>exerciseBlock(e,p.id,i)).join('')}`).join('')}`}
function habitsPage(){let h=habitProgress().done;return `${header()}<h1>Daily habits</h1><p class="muted">Small actions, repeated consistently. Tap a checkbox or its label to mark it done.</p><div class="card"><h2>Water goal</h2><div class="between"><strong class="large">${safe(day().values.water||0)} <span class="muted">/ ${state.waterGoal} oz</span></strong><span class="pill">+20 XP</span></div><div class="progress"><div style="width:${Math.min(100,100*(Number(day().values.water)||0)/state.waterGoal)}%"></div></div><div class="row" style="margin-top:13px"><button class="action" onclick="waterAdd(8)">+8 oz</button><button class="action" onclick="waterAdd(16)">+16 oz</button><button class="action ghost" onclick="waterAdd(-8)">−8 oz</button></div></div><div class="card"><div class="between"><h2>Habit checklist</h2><span class="pill">${h}/${habitProgress().total}</span></div>${applicableHabits().map(([id,n,d])=>checkrow('habit:'+id,n,d)).join('')}<p class="foot">Habit goals include checklist items, your water goal. Workday walks and desk mobility are counted only Monday–Friday.</p></div>`}
function plan(){let selected=new Date(state.selected+'T12:00:00'),year=selected.getFullYear(),month=selected.getMonth(),first=new Date(year,month,1),offset=(first.getDay()+6)%7,days=new Date(year,month+1,0).getDate(),cells='';for(let i=0;i<Math.ceil((offset+days)/7)*7;i++){let n=i-offset+1;if(n<1||n>days){cells+='<div class="cal-empty"></div>';continue}let iso=year+'-'+String(month+1).padStart(2,'0')+'-'+String(n).padStart(2,'0'),sessions=planned(iso),d=state.dates[iso],finished=dayCompleted(iso);cells+=`<button aria-label="${iso}${finished?' completed':''}" class="cal-cell ${iso===state.selected?'selected':''} ${finished?'done':''}" onclick="openDay('${iso}')"><strong>${n}</strong><span>${sessions.map(p=>p.id==='flow'?'F':p.id==='mob'?'M':p.id==='strength'?'S':p.id==='cardio'?'B':'R').join(' · ')}</span></button>`}let prev=new Date(year,month-1,1),next=new Date(year,month+1,1),fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01';return `${header()}<h1>Training calendar</h1><p class="muted">Completed days turn fully gold when all daily guide steps are finished. Tap a day to open its exercises. F = Flow, M = Mobility, S = Strength, B = Bike, R = Recovery.</p><div class="card"><div class="between"><button class="action" onclick="setDate('${fmt(prev)}')">‹</button><h2>${safe(selected.toLocaleDateString('en-US',{month:'long',year:'numeric'}))}</h2><button class="action" onclick="setDate('${fmt(next)}')">›</button></div><div class="cal-grid">${['M','T','W','T','F','S','S'].map(x=>`<div class="cal-head">${x}</div>`).join('')}${cells}</div></div><div class="card"><h2>Weekly training structure</h2><p><strong>Mon:</strong> Flow + easy bike 15–20 min (bike optional)</p><p><strong>Tue:</strong> Mobility Flow + Upper A</p><p><strong>Wed:</strong> Flow + easy bike 20–25 min</p><p><strong>Thu:</strong> Mobility Flow + Upper B</p><p><strong>Fri:</strong> Flow + longer easy bike 25–40 min</p><p><strong>Sat:</strong> Lower-body strength</p><p><strong>Sun:</strong> Recovery / optional walking</p><div class="note">Use pain-tolerated ranges and adjust training volume based on recovery. Sunday recovery can be checked off as completed without earning XP.</div></div>`}
function openDay(iso){state.selected=iso;state.view='workout';save();render();window.scrollTo(0,0)}
function progress(){let x=xpTotal(),count=Object.values(state.dates).reduce((n,d)=>n+Object.values(d.checks||{}).filter(Boolean).length,0),levels=DATA.backLevels;return `${header()}<h1>Your journey</h1><p class="muted">Completed days, XP and back-extension progress.</p><div class="card"><div class="between"><h2>Level ${lvl()}</h2><strong class="accent">${x} XP</strong></div><div class="progress"><div style="width:${x%500/5}%"></div></div><p class="muted">${500-x%500} XP until your next level</p><div class="statrow"><div class="stat"><strong>${Object.keys(state.dates).filter(dayCompleted).length}</strong><small>Days completed</small></div><div class="stat"><strong>${count}</strong><small>Checks</small></div><div class="stat"><strong>${state.backDeposits.length}</strong><small>Back deposits</small></div></div></div><div class="card"><h2>Back extension progression</h2><p class="muted">Progress manually. Keep Level 1 until the hold is stable and your next-day response supports advancing. The program advises at least 10 deposits per duration increase and 3 consecutive symptom-stable weeks before progression.</p>${levels.map((v,i)=>`<div class="exercise"><span class="pill">${i+1}</span><div class="exbody"><strong>${safe(v.name)}</strong><small>${safe(v.target)}</small></div><button class="action ${state.level===i+1?'primary':'ghost'}" onclick="chooseLevel(${i+1})">${state.level===i+1?'Current':'Select'}</button></div>`).join('')}<h3>Recent deposits</h3>${state.backDeposits.slice(-8).reverse().map(v=>`<div class="between"><span>${safe(v.date)} · L${v.level}</span><strong>${safe(v.result)}</strong></div>`).join('')||'<p class="muted">No deposits recorded yet.</p>'}</div></div>`}
function chooseLevel(n){if(n!==state.level&&!confirm('Change your back-extension level? Progress only after the previous level feels comfortable and your next-day symptoms remain stable.'))return;state.level=n;save();render()}
function clearAllProgress(){
 if(!confirm('Clear ALL saved progress on this device? This deletes workout logs, habits, XP, completed days, and back-extension records. This cannot be undone unless you exported a backup.'))return;
 const phrase=prompt('To confirm permanent deletion, type CLEAR exactly:');
 if(phrase!=='CLEAR'){alert('Progress was not cleared.');return;}
 try{localStorage.removeItem(KEY)}catch(e){alert('Could not clear browser storage.');return;}
 location.reload();
}
function settings(){return `${header()}<h1>Settings & backup</h1><div class="card"><h2>Goals</h2><div class="grid2"><label>Daily water (oz)<input class="input" type="number" min="16" max="200" value="${state.waterGoal}" onchange="field('waterGoal',Number(this.value))"></label></div><label>Program start date<input class="input" type="date" value="${safe(state.start)}" onchange="field('start',this.value)"></label></div><div class="card"><h2>Your data</h2><p class="muted">This HTML preview saves data in this browser's local storage. It does not sync across devices. Export regularly before replacing the app.</p><div class="row"><button class="action primary" onclick="exportData()">Export JSON backup</button><label class="action ghost">Import JSON<input type="file" accept="application/json" style="display:none" onchange="importData(this.files[0])"></label></div></div><div class="card"><h2>Clear all progress</h2><p class="muted">Permanently delete saved workouts, habits, XP, completed days, and back-extension deposits on this device. Your workout plan and app settings return to defaults. Export a backup first if you want to keep your records.</p><button class="action" style="border-color:#c65b5b;color:#ffb3b3;background:#341a1a" onclick="clearAllProgress()">Clear all progress…</button></div><div class="card"><h2>About this preview</h2><p class="muted">Chris's App · black + green · mobile-first · no notifications. This standalone HTML is for review. The final GitHub Pages release will include installable PWA files and offline caching.</p><p class="foot">Exercise prescriptions are based on the information you supplied from your program. This is not an official Low Back Ability app. Stop or modify activities that aggravate symptoms and consider a sports physical therapist for persistent knee/hip pain.</p></div>`}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='chris-app-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importData(file){if(!file)return;try{let d=JSON.parse(await file.text());if(!d||typeof d!=='object'||!d.dates)throw Error('Not a valid backup');if(!confirm('Replace current app data with this backup?'))return;state=d;save();render()}catch(e){alert('Import failed: '+e.message)}}
function render(){clearInterval(interval);let pages={home,workout,habits:habitsPage,plan,progress,settings};document.getElementById('app').innerHTML=(pages[state.view]||home)();document.getElementById('nav').innerHTML=[['home','◎','Today'],['workout','▣','Workout'],['plan','▦','Calendar'],['progress','↗','Progress'],['settings','⚙','Settings']].map(([id,icon,name])=>`<button class="${state.view===id?'active':''}" onclick="navTo('${id}')"><b>${icon}</b>${name}</button>`).join('')}
render();
</script></body></html>
